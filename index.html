<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color"
        content="#FFC107">

  <title>Chấm Công</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">

    <div class="user">
      <div class="avatar">ĐG</div>

      <div>
        <span>Xin chào 👋</span>
        <h2>Đức Giang</h2>
      </div>
    </div>

    <button class="notification">
      🔔
    </button>

  </header>


  <!-- CONTENT -->
  <main>

    <div class="date" id="currentDate"></div>

    <h1>Hôm nay</h1>


    <!-- ATTENDANCE CARD -->
    <section class="attendance-card">

      <div class="status" id="status">
        <span></span>
        Chưa chấm công
      </div>

      <div class="fingerprint">
        👆
      </div>

      <p class="shift-title">
        Ca làm việc
      </p>

      <div class="shift">
        08:00 - 17:30
      </div>


      <button
        class="attendance-btn"
        id="attendanceBtn"
        onclick="attendance()">

        👆 CHẤM CÔNG VÀO

      </button>

    </section>


    <!-- INFO -->
    <div class="info-grid">

      <div class="info-card">
        <div class="icon">↪</div>
        <span>Giờ vào</span>
        <strong id="checkIn">--:--</strong>
      </div>

      <div class="info-card">
        <div class="icon">↩</div>
        <span>Giờ ra</span>
        <strong id="checkOut">--:--</strong>
      </div>

      <div class="info-card">
        <div class="icon">⏱</div>
        <span>Tổng giờ</span>
        <strong id="totalTime">0h 00m</strong>
      </div>

      <div class="info-card">
        <div class="icon">📅</div>
        <span>Ngày công</span>
        <strong>22 ngày</strong>
      </div>

    </div>


    <!-- RECENT -->
    <section class="recent">

      <h3>Hoạt động gần đây</h3>

      <div class="activity">

        <div class="activity-icon">
          ↪
        </div>

        <div>
          <strong>Chấm công vào</strong>
          <span id="recentIn">
            Chưa chấm công
          </span>
        </div>

      </div>


      <div class="activity">

        <div class="activity-icon">
          ↩
        </div>

        <div>
          <strong>Chấm công ra</strong>
          <span id="recentOut">
            Chưa chấm công
          </span>
        </div>

      </div>

    </section>

  </main>


  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">

    <button class="active">
      🏠
      <span>Trang chủ</span>
    </button>

    <button onclick="showMessage('Lịch chấm công')">
      📅
      <span>Lịch</span>
    </button>

    <button onclick="showMessage('Thống kê')">
      📊
      <span>Thống kê</span>
    </button>

    <button onclick="showMessage('Cá nhân')">
      👤
      <span>Cá nhân</span>
    </button>

  </nav>

</div>

<script src="app.js"></script>

</body>
</html>
